[project]
name = "shape-analysis"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy<2.0",
    "matplotlib",
    "torch==2.2.2",
    "torchvision",
    "pandas",
    "tqdm",
    "trimesh",
    "PyYAML",
    "requests",
    "cmake",
    "pytest",
    "isort",
    "black",
    "torch_geometric",
    "torch-scatter",
]

[tool.uv.extra-build-dependencies]
torch-scatter = ["torch==2.2.2"]

[tool.setuptools]
py-modules = ["datasets"]
packages = ["scripts"]
